[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
game_core = { path = "../game_core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["CanvasRenderingContext2d", "Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "Location", "MessageEvent", "MouseEvent", "Node", "WebSocket", "Window"] }

[lib]
crate-type = ["cdylib", "rlib"]
